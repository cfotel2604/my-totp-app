<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud TOTP Authenticator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-2">
          ☁️ Cloud TOTP
        </h1>
        <p class="text-xs text-slate-400">Đồng bộ đa thiết bị qua Cloudflare D1</p>
      </div>
      <button onclick="fetchAccounts()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg transition">
        🔄 Làm mới
      </button>
    </div>

    <!-- Form thêm mới -->
    <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl mb-6">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input id="issuer" type="text" placeholder="Tên (VD: GitHub - user)" 
               class="md:col-span-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <input id="secret" type="text" placeholder="Secret Base32 hoặc otpauth://..." 
               class="md:col-span-2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <button id="btn-add" onclick="addAccount()" 
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg px-4 py-2 text-sm transition">
          + Thêm
        </button>
      </div>
    </div>

    <!-- Thanh đếm ngược 30s -->
    <div class="mb-4">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>Đổi mã sau</span>
        <span id="countdown-text" class="font-mono font-bold text-blue-400">30s</span>
      </div>
      <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-1000" style="width: 100%"></div>
      </div>
    </div>

    <!-- Danh sách Token -->
    <div id="tokens-list" class="space-y-3">
      <div class="text-center text-slate-500 py-10 text-sm">Đang tải dữ liệu từ Cloudflare D1...</div>
    </div>
  </div>

  <!-- Toast thông báo -->
  <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity">
    Đã copy mã OTP!
  </div>

  <script>
    let accounts = [];

    function base32ToBytes(base32) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      const cleaned = base32.toUpperCase().replace(/[^A-Z2-7]/g, '');
      let bits = '';
      for (let i = 0; i < cleaned.length; i++) {
        bits += alphabet.indexOf(cleaned[i]).toString(2).padStart(5, '0');
      }
      const bytes = new Uint8Array(Math.floor(bits.length / 8));
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(bits.slice(i * 8, (i + 1) * 8), 2);
      }
      return bytes;
    }

    async function generateTOTP(secret) {
      try {
        const keyBytes = base32ToBytes(secret);
        if (keyBytes.length === 0) return 'INVALID';

        const counter = Math.floor(Math.floor(Date.now() / 1000) / 30);
        const counterBytes = new Uint8Array(8);
        let temp = counter;
        for (let i = 7; i >= 0; i--) {
          counterBytes[i] = temp & 0xff;
          temp = Math.floor(temp / 256);
        }

        const cryptoKey = await crypto.subtle.importKey(
          'raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']
        );
        const hmac = await crypto.subtle.sign('HMAC', cryptoKey, counterBytes);
        const hmacBytes = new Uint8Array(hmac);

        const offset = hmacBytes[hmacBytes.length - 1] & 0x0f;
        const binary =
          ((hmacBytes[offset] & 0x7f) << 24) |
          ((hmacBytes[offset + 1] & 0xff) << 16) |
          ((hmacBytes[offset + 2] & 0xff) << 8) |
          (hmacBytes[offset + 3] & 0xff);

        return (binary % 1000000).toString().padStart(6, '0');
      } catch (e) {
        return 'ERROR';
      }
    }

    // Tải danh sách từ Cloudflare D1
    async function fetchAccounts() {
      try {
        const res = await fetch('/api/accounts');
        accounts = await res.json();
        renderTokens();
      } catch (e) {
        document.getElementById('tokens-list').innerHTML = 
          `<div class="text-center text-red-400 py-8 text-sm">Lỗi kết nối API D1! Hãy kiểm tra lại D1 Binding.</div>`;
      }
    }

    // Thêm tài khoản lên D1
    async function addAccount() {
      let name = document.getElementById('issuer').value.trim();
      let secretInput = document.getElementById('secret').value.trim();

      if (!secretInput) return alert('Vui lòng nhập Secret Key hoặc URI otpauth://');

      if (secretInput.startsWith('otpauth://')) {
        try {
          const url = new URL(secretInput);
          const params = new URLSearchParams(url.search);
          const extractedSecret = params.get('secret');
          const issuer = params.get('issuer') || '';
          const label = decodeURIComponent(url.pathname.replace(/^\/\/totp\/|^\//, ''));
          if (extractedSecret) {
            secretInput = extractedSecret;
            if (!name) name = issuer ? `${issuer} (${label})` : label;
          }
        } catch (e) {
          return alert('Định dạng otpauth:// không hợp lệ!');
        }
      }

      if (!name) name = 'Tài khoản không tên';
      const cleanSecret = secretInput.replace(/\s+/g, '');

      const btn = document.getElementById('btn-add');
      btn.disabled = true;
      btn.innerText = 'Đang lưu...';

      await fetch('/api/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, secret: cleanSecret })
      });

      document.getElementById('issuer').value = '';
      document.getElementById('secret').value = '';
      btn.disabled = false;
      btn.innerText = '+ Thêm';

      await fetchAccounts();
    }

    // Xóa tài khoản khỏi D1
    async function deleteAccount(id) {
      if (!confirm('Xóa mã TOTP này trên toàn bộ thiết bị?')) return;
      await fetch(`/api/accounts?id=${id}`, { method: 'DELETE' });
      await fetchAccounts();
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code);
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1800);
    }

    async function renderTokens() {
      const container = document.getElementById('tokens-list');
      if (!Array.isArray(accounts) || accounts.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-500 py-10 border border-dashed border-slate-800 rounded-xl text-sm">Chưa có tài khoản nào trên Cloud.</div>`;
        return;
      }

      let html = '';
      for (const acc of accounts) {
        const code = await generateTOTP(acc.secret);
        const formattedCode = code.length === 6 ? `${code.slice(0, 3)} ${code.slice(3)}` : code;
        html += `
          <div class="bg-slate-800 border border-slate-700/80 hover:border-slate-600 rounded-xl p-4 flex justify-between items-center transition">
            <div>
              <div class="text-xs text-slate-400 font-medium mb-1">${acc.name}</div>
              <div onclick="copyCode('${code}')" class="text-2xl font-mono font-bold text-white tracking-wider cursor-pointer hover:text-blue-400 transition">
                ${formattedCode}
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="copyCode('${code}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition">Copy</button>
              <button onclick="deleteAccount(${acc.id})" class="text-xs text-red-400 hover:bg-red-950/60 px-2.5 py-1.5 rounded-lg transition">✕</button>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    let lastWindow = -1;
    setInterval(() => {
      const epoch = Math.floor(Date.now() / 1000);
      const remaining = 30 - (epoch % 30);
      const currentWindow = Math.floor(epoch / 30);

      document.getElementById('countdown-text').innerText = `${remaining}s`;
      document.getElementById('progress-bar').style.width = `${(remaining / 30) * 100}%`;

      if (currentWindow !== lastWindow) {
        lastWindow = currentWindow;
        renderTokens();
      }
    }, 1000);

    fetchAccounts();
  </script>
</body>
</html>
